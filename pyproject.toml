[project]
name = "gdb-mcp-server"
version = "0.2.0"
description = "MCP server for interacting with GDB debugging sessions"
authors = [{name = "Andrew Stelter"}]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.1",
    "mcp>=1.24,<2",
    "pygdbmi>=0.11.0.0",
    "starlette>=0.27",
    "uvicorn>=0.31.1",
]

[project.scripts]
gdb-mcp-server = "gdb_mcp.server:run_server"
gdb-mcp-client = "gdb_mcp.client:run_client"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "types-jsonschema>=4.20.0",
    "mcp[cli]>=1.24,<2",
    "ruff>=0.16",
    # The runtime works on starlette 0.27, but its TestClient needs 0.36+ with
    # httpx 0.27 (older releases still use the removed httpx._types.URLTypes).
    "starlette>=0.36",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gdb_mcp = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Dispatch, CLI, and shutdown paths deliberately turn any failure into a
# structured error envelope instead of letting it escape.
ignore = ["BLE001"]
