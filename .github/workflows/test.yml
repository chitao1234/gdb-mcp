name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install GDB, GCC, and rr
      run: |
        sudo apt-get update
        sudo apt-get install -y gdb g++ rr

    # rr records with perf events, so it needs a low perf_event_paranoid and an
    # unrestricted kptr. These are enough on a self-hosted runner, but the
    # GitHub-hosted VMs expose no hardware counters: even with both set,
    # `perf_event_open` fails and rr cannot record. The rr integration test then
    # skips itself (see `-rs` output) instead of failing.
    - name: Prepare rr
      run: |
        sudo sysctl -w kernel.perf_event_paranoid=1
        sudo sysctl -w kernel.kptr_restrict=0
        echo "perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)"
        echo "kptr_restrict=$(cat /proc/sys/kernel/kptr_restrict)"
        rr record -o "$RUNNER_TEMP/rr-probe" /bin/true \
          || echo "::warning::rr cannot record on this runner; the rr integration test will skip"

    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short -n auto -rs

    - name: Check Python syntax
      run: |
        python -m py_compile src/gdb_mcp/*.py

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check code formatting with black
      run: |
        black --check src/ tests/

    - name: Lint with ruff
      run: |
        ruff check src/ tests/

    - name: Type check with mypy
      run: |
        mypy src tests
