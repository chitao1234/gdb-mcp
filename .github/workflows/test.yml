name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  profiles:
    name: Discover compatibility profiles
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.discover.outputs.names }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Read curated toolchain names from flake.nix
        id: discover
        run: |
          echo "names=$(nix eval --json .#ciProfileNames)" >> "$GITHUB_OUTPUT"

  compatibility:
    name: ${{ matrix.profile }}
    needs: profiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.names) }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Show toolchain versions
        run: |
          nix develop ".#${{ matrix.profile }}" --command bash -c '
            python --version
            gdb --version | head -n 1
            lldb --version | head -n 1
            go version
            dlv version | head -n 3
            c++ --version | head -n 1
          '

      - name: Verify GDB's Python 2.6
        if: startsWith(matrix.profile, 'oldest-')
        run: |
          nix develop ".#${{ matrix.profile }}" --command bash -c '
            python2.6 --version
            gdb --batch -ex "python import sys; print sys.version"
          '

      # Delve attach and some LLDB/GDB attach tests need to trace a sibling
      # process rather than only their own child.
      - name: Allow sibling debugger attach
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      # Hosted runners do not expose the perf events rr needs, so rr is not
      # installed; test_v2_rr_replay.py skips when it is absent.
      - name: Run tests
        run: |
          nix develop ".#${{ matrix.profile }}" --command bash -euo pipefail -c '
            ulimit -c 0
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"
            if [[ "${{ matrix.profile }}" == oldest-* || "${{ matrix.profile }}" == legacy-* ]]; then
              pytest tests/ -m "not integration" -v --tb=short -n auto -rs
              pytest tests/integration/test_compatibility_baseline.py \
                tests/integration/test_v2_session_delve.py -v --tb=short -rs
            else
              pytest tests/ -v --tb=short -n auto -rs
            fi
          '

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting with black
        run: |
          black --check src/ tests/

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Type check with mypy
        run: |
          mypy src tests
