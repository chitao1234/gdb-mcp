name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install GDB, GCC, and rr
      run: |
        sudo apt-get update
        sudo apt-get install -y gdb g++ rr

    # rr records with perf events and needs an unrestricted kptr, which the
    # runner image does not grant by default. When these cannot be set, the rr
    # integration test skips itself instead of failing.
    - name: Relax perf settings for rr
      run: |
        sudo sysctl -w kernel.perf_event_paranoid=1
        sudo sysctl -w kernel.kptr_restrict=0

    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short -n auto

    - name: Check Python syntax
      run: |
        python -m py_compile src/gdb_mcp/*.py

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check code formatting with black
      run: |
        black --check src/ tests/

    - name: Lint with ruff
      run: |
        ruff check src/ tests/

    - name: Type check with mypy
      run: |
        mypy src tests
